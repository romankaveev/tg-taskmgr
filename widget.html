<style>
body{margin:0;font:13px system-ui;color:var(--tg-theme-text-color,#0b0b0b);background:var(--tg-theme-bg-color,#fcfcfb)}
.hd{display:flex;justify-content:space-between;padding:8px 10px 0;font-weight:600}
.hd small{font-weight:400;color:var(--tg-theme-hint-color,#52514e)}
.tb{display:flex;gap:14px;padding:6px 10px 0;border-bottom:1px solid #8883}
.tb b{padding:4px 0 6px;cursor:pointer;font-weight:500;color:var(--tg-theme-hint-color,#52514e);border-bottom:2px solid transparent}
.tb b.on{color:inherit;border-color:var(--tg-theme-button-color,#2a78d6)}
table{width:100%;border-collapse:collapse}
th{font-weight:400;text-align:right;padding:4px 8px;color:var(--tg-theme-hint-color,#52514e);font-size:11px}
th big{display:block;font-size:15px;color:var(--tg-theme-text-color,#0b0b0b)}
th:first-child,td:first-child{text-align:left}
td{padding:4px 8px;border-top:1px solid #8882;text-align:right;white-space:nowrap}
td:first-child{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ft{padding:6px 10px;font-size:11px;color:var(--tg-theme-hint-color,#52514e)}
.cd{padding:6px 10px}.cd div{display:flex;justify-content:space-between}
.cd span{color:var(--tg-theme-hint-color,#52514e);font-size:11px}
canvas{width:100%;height:56px;display:block;margin-top:3px;border:1px solid #8884}
#ps{display:none;width:calc(100% - 20px);margin:6px 10px;padding:8px;border:0;border-radius:8px;background:var(--tg-theme-button-color,#2a78d6);color:var(--tg-theme-button-text-color,#fff)}
.rg{display:flex;gap:6px;padding:6px 10px 0}.rg b{font-weight:500;font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid #8885}.rg b.on{background:var(--tg-theme-button-color,#2a78d6);color:var(--tg-theme-button-text-color,#fff);border-color:transparent}
</style>
<div class="hd">Диспетчер задач · VDS<small id="up"></small></div>
<div class="tb"><b class="on" data-t="P">Процессы</b><b data-t="F">Производительность</b></div>
<div id="P"><table><thead><tr><th>Имя</th><th>ЦП<big id="hc">–</big></th><th>Память<big id="hm">–</big></th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="F" hidden><div class="rg"><b data-r="2" class="on">2 мин</b><b data-r="10">10 мин</b><b data-r="60">1 час</b></div><div id="G"></div></div>
<div class="ft" id="ft">Подключаюсь…</div><button id="ps">▶ Продолжить обновление</button>
<script>
const W=window.TelegramWidget,$=i=>document.getElementById(i),A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const bg=getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-bg-color').trim(),dk=/^#[0-9a-f]{6}$/i.test(bg)&&[1,3,5].reduce((a,k)=>a+parseInt(bg.substr(k,2),16),0)<384;
const C=dk?['#3987e5','#d95926','#199e70','#c98500']:['#2a78d6','#eb6834','#1baf7a','#eda100'];
const R=['ЦП','Память','Диск','Сеть'],PT={2:[60,2],10:[120,5],60:[120,30]},hv=[-1,-1,-1,-1];let last,rg='2',t0=Date.now(),busy=0,stop=0,H=[[],[],[],[]];
$('G').innerHTML=R.map((r,i)=>`<div class="cd"><div><b>${r}</b><b id="v${i}"></b></div><span id="s${i}"></span><canvas id="g${i}" width="600" height="112"></canvas></div>`).join('');
document.querySelectorAll('.tb b').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb b').forEach(x=>x.classList.toggle('on',x==b));$('P').hidden=b.dataset.t!='P';$('F').hidden=b.dataset.t!='F';draw()});
document.querySelectorAll('.rg b').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rg b').forEach(x=>x.classList.toggle('on',x==b));rg=b.dataset.r;poll()});
const kb=v=>v>=1024?(v/1024).toFixed(1)+' МБ/с':Math.round(v)+' КБ/с',mb=v=>v>=1024?(v/1024).toFixed(1)+' ГБ':v+' МБ';
const ago=s=>s<60?s+' с назад':Math.round(s/60)+' мин назад';
const heat=(v,mx)=>`background:rgba(255,185,0,${Math.min(.08+v/mx*.6,.68).toFixed(2)})`;
function txt(d){return[[d.c+'%',d.k+' ядра · загрузка '+d.l],[mb(d.m[0])+' / '+mb(d.m[1]),'подкачка '+mb(d.s[0])+' / '+mb(d.s[1])],['чт '+kb(d.d[2])+' · зп '+kb(d.d[3]),'занято '+d.d[0]+' / '+d.d[1]+' ГБ'],['↓ '+kb(d.n[0])+' · ↑ '+kb(d.n[1]),'основной интерфейс']]}
function draw(){if(!last||$('F').hidden)return;const[N,P]=PT[last.r];txt(last).forEach((x,i)=>{const h=H[i],g=$('g'+i),c=g.getContext('2d'),w=g.width,ht=g.height,mx=last.h[i][0],j=hv[i]>=0?Math.min(hv[i],h.length-1):-1;
$('v'+i).textContent=j>=0?(i<2?'≈'+h[j].toFixed(0)+'%':'≈'+kb(h[j]))+' · '+ago((h.length-1-j)*P):x[0];$('s'+i).textContent=x[1];
c.clearRect(0,0,w,ht);c.strokeStyle='#8883';c.lineWidth=1;for(let k=1;k<4;k++){c.beginPath();c.moveTo(0,ht*k/4);c.lineTo(w,ht*k/4);c.stroke()}
if(!h.length)return;const X=k=>w-(h.length-1-k)*w/(N-1),Y=y=>ht-2-y/mx*(ht-4);c.beginPath();h.forEach((y,k)=>k?c.lineTo(X(k),Y(y)):c.moveTo(X(k),Y(y)));
c.strokeStyle=C[i];c.lineWidth=4;c.stroke();c.lineTo(w,ht);c.lineTo(X(0),ht);c.fillStyle=C[i]+'26';c.fill();
if(j>=0){c.strokeStyle='#888';c.lineWidth=2;c.beginPath();c.moveTo(X(j),0);c.lineTo(X(j),ht);c.stroke()}
g.onpointermove=e=>{const r=g.getBoundingClientRect();hv[i]=Math.max(0,Math.round(h.length-1-(1-(e.clientX-r.left)/r.width)*(N-1)));draw()};g.onpointerleave=()=>{hv[i]=-1;draw()}})}
function show(d){if(d.e){$('ft').textContent='Ошибка: '+d.e;return}last=d;H=d.h.map(([s,q])=>[...q].map(ch=>A.indexOf(ch)/63*s));
$('hc').textContent=d.c+'%';$('hm').textContent=Math.round(d.m[0]/d.m[1]*100)+'%';const u=d.u;$('up').textContent='аптайм '+Math.floor(u/86400)+' д '+Math.floor(u%86400/3600)+' ч';
$('rows').innerHTML=d.p.map(p=>`<tr><td>${p[0]}${p[1]>1?' ('+p[1]+')':''}</td><td style="${heat(p[2],100/d.k)}">${p[2]}%</td><td style="${heat(p[3],d.m[1]/4)}">${mb(p[3])}</td></tr>`).join('');
$('ft').textContent='Процессов: '+d.t+' · обновлено '+new Date().toLocaleTimeString('ru-RU');draw()}
let dl=5e3;function poll(){if(busy)return;busy=1;return W.request('a'+rg).then(a=>{dl=5e3;show(JSON.parse(a.result))},e=>{if(e.code=='rate_limited'){dl=Math.min(dl*2,3e4);$('ft').textContent='Telegram просит реже — обновляю раз в '+dl/1e3+' с'}else $('ft').textContent='Ошибка: '+e.code}).finally(()=>busy=0)}
function tick(){if(stop)return;if(Date.now()-t0>6e5){stop=1;$('ps').style.display='block';$('ft').textContent='Обновление на паузе (история на сервере пишется всегда)';return}
if(!document.hidden)poll();setTimeout(tick,dl)}
$('ps').onclick=()=>{stop=0;t0=Date.now();$('ps').style.display='none';tick()};tick();W.ready&&W.ready();
</script>
